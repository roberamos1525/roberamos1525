<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Let's build something dependable.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".6" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#10123a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .t{font:600 22px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7;text-anchor:middle}
      .s{font:400 13px 'Cascadia Code',Consolas,Menlo,monospace;fill:#8ba3c7;text-anchor:middle}
      .bar{animation:sweep 4s ease-in-out infinite alternate}
      @keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
    </style>
  </defs>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <text x="600" y="54" class="t">Let’s build something dependable.</text>
  <text x="600" y="80" class="s">roberamos1525 · full-stack · applied ai · ai evaluation</text>
  <g class="bar"><rect x="540" y="94" width="120" height="3" rx="1.5" fill="url(#accent)"/></g>
</svg>
